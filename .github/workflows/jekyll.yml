# GitHub Pages already publishes master through its built-in Pages workflow.
# Validate changes here without starting a second competing deployment.
name: Validate Jekyll site

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jekyll-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build with the GitHub Pages Jekyll environment
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Check internal page and asset links
        run: python3 .github/scripts/check_site.py _site https://adibiarman.github.io
